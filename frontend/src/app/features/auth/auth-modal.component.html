<div class="modal-backdrop" (click)="close()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-brand">
        <span class="comic-badge">HERO PASS</span>
        <h2>{{ authService.authModalMode() === 'login' ? 'Welcome Back!' : 'Join The Library' }}</h2>
      </div>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <!-- Mode Tabs -->
    <div class="auth-tabs">
      <button
        class="tab-btn"
        [class.active]="authService.authModalMode() === 'login'"
        (click)="setMode('login')"
      >
        Sign In
      </button>
      <button
        class="tab-btn"
        [class.active]="authService.authModalMode() === 'register'"
        (click)="setMode('register')"
      >
        Create Account
      </button>
    </div>

    <!-- Error Banner -->
    <div *ngIf="errorMessage()" class="error-banner">
      ⚠️ {{ errorMessage() }}
    </div>

    <!-- Login Form -->
    <form *ngIf="authService.authModalMode() === 'login'" (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [(ngModel)]="loginEmail"
          name="email"
          placeholder="your.email@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="loginPassword"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing In...' : 'Sign In to Access' }}
      </button>

      <!-- Quick Demo Switcher -->
      <div class="demo-section">
        <span class="demo-title">⚡ Instant Demo One-Click Sign-In:</span>
        <div class="demo-buttons">
          <button type="button" class="demo-btn admin" (click)="quickLogin('admin@library.com')">
            🛡️ Admin
          </button>
          <button type="button" class="demo-btn librarian" (click)="quickLogin('aungkyaw@library.com')">
            📖 Librarian
          </button>
          <button type="button" class="demo-btn member" (click)="quickLogin('hlahla@gmail.com')">
            🦇 Member
          </button>
        </div>
      </div>
    </form>

    <!-- Register Form -->
    <form *ngIf="authService.authModalMode() === 'register'" (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input
            type="text"
            [(ngModel)]="regFirstName"
            name="firstName"
            placeholder="Bruce"
            required
          />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input
            type="text"
            [(ngModel)]="regLastName"
            name="lastName"
            placeholder="Wayne"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [(ngModel)]="regEmail"
          name="email"
          placeholder="bruce@wayne-enterprises.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Phone Number (Optional)</label>
        <input
          type="tel"
          [(ngModel)]="regPhone"
          name="phone"
          placeholder="0912345678"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="regPassword"
          name="password"
          placeholder="At least 6 characters"
          required
        />
      </div>

      <button type="submit" class="submit-btn register" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating Hero Pass...' : 'Create Account & Membership' }}
      </button>
    </form>
  </div>
</div>
